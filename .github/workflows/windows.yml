name: Windows checks and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned runtime and build dependencies
        run: python -m pip install -e . pyinstaller==6.22.0
      - name: Test and build
        run: |
          node --test tests/museum_render.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
